services:
  postgres:
    image: postgis/postgis:18-3.7
    shm_size: 128mb
    # tox -p: each env opens up to ~50 connections
    command: -c max_connections=1000
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - 5432
    ports:
      - '127.0.0.1:5432:5432'
