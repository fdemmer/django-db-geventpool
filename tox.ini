[tox]
requires = tox-uv
envlist =
  py3{9,10,11,12}-dj{42}-pg{2-gis,2}
  py3{9,10,11,12}-dj{42}-pg{3-gis,3}
  py3{10,11,12,13,14}-dj{52}-pg{2-gis,2,3-gis,3}
  py3{12,13,14}-dj{60}-pg{2-gis,2,3-gis,3}
  py3{12,13,14,15}-dj{61}-pg{2-gis,2,3-gis,3}
  py3{12,14}-dj{52,61}-pg2-eventlet

[testenv]
pass_env =
  PG*
set_env =
  TEST_DB_NAME = test_{env_name}
deps =
  !eventlet: gevent
  eventlet: eventlet
  psycogreen
  dj42: django~=4.2.0
  dj52: django~=5.2.0
  dj60: django~=6.0.0
  dj61: django~=6.1.0
  pg2: psycopg2-binary
  pg3: psycopg[binary,pool]

commands =
  pg2-gis: python -Wall runtests_psycopg2_gis.py
  pg2-!gis-!eventlet: python -Wall runtests_psycopg2.py
  pg2-eventlet: python -Wall runtests_psycopg2_eventlet.py
  pg3-gis: python -Wall runtests_psycopg3_gis.py
  pg3-!gis: python -Wall runtests_psycopg3.py
