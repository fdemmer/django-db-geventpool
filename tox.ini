[tox]
requires = tox-uv
envlist =
  py3{9,10,11,12}-dj{42}-pg{2-gis,2}
  py3{9,10,11,12}-dj{42}-pg{3-gis,3}
  py3{10,11,12,13,14}-dj{52}-pg{2-gis,2,3-gis,3}
  py3{12,13,14}-dj{60}-pg{2-gis,2,3-gis,3}
  py3{12,13,14,15}-dj{61}-pg{2-gis,2,3-gis,3}
  py3{12,14}-dj{52,61}-pg2-eventlet

[testenv]
pass_env =
  PG*
  RUN_COVERAGE
set_env =
  TEST_DB_NAME = test_{env_name}
  DJANGO_SETTINGS_MODULE = tests.settings
  pg2-!gis: DB_ENGINE = postgresql_psycopg2
  pg3-!gis: DB_ENGINE = postgresql_psycopg3
  gis: DB_ENGINE = postgis
  !eventlet: GREEN = gevent
  eventlet: GREEN = eventlet
deps =
  !eventlet: gevent
  eventlet: eventlet
  psycogreen
  coverage[toml]
  dj42: django~=4.2.0
  dj52: django~=5.2.0
  dj60: django~=6.0.0
  dj61: django~=6.1.0
  pg2: psycopg2-binary
  pg3: psycopg[binary,pool]

# gevent and eventlet must monkey-patch before Django is imported.
# RUN_COVERAGE optionally runs that under coverage, see `just test_coverage`.
commands =
  !eventlet-!gis: python -Wall {env:RUN_COVERAGE:} -m gevent.monkey --module django test -v 2 {posargs:tests.tests}
  gis: python -Wall {env:RUN_COVERAGE:} -m gevent.monkey --module django test -v 2 {posargs:tests.tests tests_gis.tests}
  eventlet: python -Wall {env:RUN_COVERAGE:} -m tests.eventlet_main test -v 2 {posargs:tests.tests}
