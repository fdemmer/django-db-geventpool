[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315

[tox]
envlist =
  py3{8,9,10,11,12}-dj{42}-pg{2-gis,2}
  py3{8,9,10,11,12}-dj{42}-pg{3-gis,3}
  py3{10,11,12,13,14}-dj{52}-pg{2-gis,2,3-gis,3}
  py3{12,13,14}-dj{60}-pg{2-gis,2,3-gis,3}
  py3{12,13,14,15}-dj{61}-pg{2-gis,2,3-gis,3}

[testenv]
deps =
  gevent
  psycogreen
  dj42: django~=4.2.0
  dj52: django~=5.2.0
  dj60: django~=6.0.0
  dj61: django~=6.1.0
  pg2-gis: psycopg2-binary
  pg2: psycopg2-binary
  pg3-gis: psycopg[binary,pool]
  pg3: psycopg[binary,pool]

commands =
  pg2-gis: python -Wall runtests_psycopg2_gis.py
  pg2: python -Wall runtests_psycopg2.py
  pg3-gis: python -Wall runtests_psycopg3_gis.py
  pg3: python -Wall runtests_psycopg3.py
