[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fdemmer-django-db-geventpool"
dynamic = ["version"]
description = "Fork of django-db-geventpool, a DB connection pool using gevent for Django"
requires-python = ">=3.8"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Javier Cordero Martinez", email = "j@jcmz.me" },
    { name = "Florian Demmer", email = "fdemmer@gmail.com" },
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "django>=4.2",
]

[project.urls]
Homepage = "https://github.com/fdemmer/django-db-geventpool"
Changelog = "https://github.com/fdemmer/django-db-geventpool/blob/master/CHANGELOG.md"
Upstream = "https://github.com/jneight/django-db-geventpool"

[tool.setuptools.dynamic]
version = {attr = "django_db_geventpool.__version__"}

[tool.setuptools.packages.find]
include = ["django_db_geventpool*"]
